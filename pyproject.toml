[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-enrichment-agent"
version = "1.0.0"
description = "Autonomous B2B Lead Enrichment Agent with Playwright crawling, LLM extraction, and external search fallback."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ApexLead Team"}
]
keywords = [
    "lead-enrichment",
    "b2b-intelligence",
    "web-crawler",
    "playwright",
    "llm",
    "gemini",
    "agentic-ai",
    "pydantic",
    "streamlit"
]
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "ddgs>=8.0.0",
    "duckduckgo_search>=7.0.0",
    "rich>=13.7.0",
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
]

[project.scripts]
lead-enrichment = "main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
